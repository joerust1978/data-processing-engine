# Spring Boot Application Configuration
spring:
  application:
    name: processing-core
  profiles:
    active: dev

# AWS Configuration
aws:
  region: us-east-2

# Logging Configuration
logging:
  level:
    com.fifththird.edo.processingcore: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Management endpoints for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Core processing configuration
core:
  processing:
    # Thread pool size for async operations
    thread-pool-size: 4
    # Default hash algorithm
    default-hash-algorithm: SHA-256
    # Validation settings
    validation:
      max-json-size: 10485760  # 10MB
      max-string-length: 1000000  # 1MB 